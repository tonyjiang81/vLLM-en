---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-proxy
  namespace: vllm-gpu
  labels:
    app: pd-proxy
    stage: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pd-proxy
  template:
    metadata:
      labels:
        app: pd-proxy
        stage: "3"
    spec:
      containers:
        - name: proxy
          image: python:3.12-slim
          command: ["python3", "/app/proxy.py"]
          env:
            - name: PREFILL_URL
              value: http://vllm-prefill:8000
            - name: DECODE_URL
              value: http://vllm-decode:8000
            - name: PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: pd-proxy-code
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-prefill
  namespace: vllm-gpu
  labels:
    app: vllm-prefill
    stage: "3"
spec:
  selector:
    app: vllm-prefill
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-decode
  namespace: vllm-gpu
  labels:
    app: vllm-decode
    stage: "3"
spec:
  selector:
    app: vllm-decode
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-pd
  namespace: vllm-gpu
  labels:
    app: pd-proxy
    stage: "3"
spec:
  selector:
    app: pd-proxy
  ports:
    - name: http
      port: 8000
      targetPort: http
