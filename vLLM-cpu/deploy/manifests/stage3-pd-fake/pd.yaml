---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-proxy
  namespace: vllm-cpu
  labels:
    app: pd-proxy
    stage: "3"
    mock: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pd-proxy
  template:
    metadata:
      labels:
        app: pd-proxy
        stage: "3"
        mock: "true"
    spec:
      containers:
        - name: proxy
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: PREFILL_URL
              value: http://vllm-prefill:8000
            - name: DECODE_URL
              value: http://vllm-decode:8000
            - name: PORT
              value: "8000"
            - name: PYTHONUNBUFFERED
              value: "1"
          command: ["python", "/app/proxy.py"]
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "200m"
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: pd-proxy-code
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-prefill
  namespace: vllm-cpu
  labels:
    app: vllm-prefill
    stage: "3"
spec:
  selector:
    app: vllm-prefill
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-decode
  namespace: vllm-cpu
  labels:
    app: vllm-decode
    stage: "3"
spec:
  selector:
    app: vllm-decode
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-pd
  namespace: vllm-cpu
  labels:
    app: pd-proxy
    stage: "3"
spec:
  selector:
    app: pd-proxy
  ports:
    - name: http
      port: 8000
      targetPort: http

