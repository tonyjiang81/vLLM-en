apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-single
  namespace: vllm-cpu
  labels:
    app: vllm-single
    stage: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-single
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: vllm-single
        stage: "1"
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:v0.33.0-x86_64
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              add: ["SYS_NICE"]
              drop: ["ALL"]
            seccompProfile:
              type: Unconfined
          env:
            - name: HOME
              value: /data
            - name: XDG_CACHE_HOME
              value: /data/.cache
            - name: VLLM_CACHE_ROOT
              value: /data/.cache/vllm
            - name: TORCH_HOME
              value: /data/.cache/torch
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "2"
            - name: VLLM_CPU_NUM_OF_RESERVED_CPU
              value: "1"
            - name: HF_HOME
              value: /data/hf-cache
            - name: PYTHONUNBUFFERED
              value: "1"
          args:
            - facebook/opt-125m
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --dtype
            - bfloat16
            - --max-model-len
            - "512"
            - --max-num-seqs
            - "4"
            - --gpu-memory-utilization
            - "0.60"
            # v0.33+ / V1: --swap-space removed; KV pressure uses preemption+RECOMPUTE
            - --enable-prefix-caching
            - --enable-chunked-prefill
            - --enforce-eager
            - --disable-log-requests
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 10
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 4Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
