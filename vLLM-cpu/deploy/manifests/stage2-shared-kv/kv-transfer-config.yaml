apiVersion: v1
kind: ConfigMap
metadata:
  name: kv-transfer-config
  namespace: vllm-cpu
  labels:
    stage: "2"
data:
  # Connector name/fields may need a one-line tweak if LMCache 0.5.x renames keys.
  kv-transfer-config.json: |
    {
      "kv_connector": "LMCacheConnectorV1",
      "kv_role": "kv_both",
      "kv_connector_extra_config": {
        "lmcache.mp.host": "lmcache.vllm-cpu.svc",
        "lmcache.mp.port": 6555
      }
    }
