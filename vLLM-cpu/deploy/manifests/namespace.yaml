apiVersion: v1
kind: Namespace
metadata:
  name: vllm-cpu
  labels:
    app.kubernetes.io/part-of: vllm-cpu-lab
    # Lab needs SYS_NICE + seccomp Unconfined for vLLM CPU NUMA tips (docs).
